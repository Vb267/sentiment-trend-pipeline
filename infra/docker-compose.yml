name: sentiment-pipeline

networks:
  pipeline_network:
    driver: bridge

volumes:
  redpanda-data: null
  clickhouse-data: null
  grafana-data: null
  processor-state: null

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - pipeline_network
    ports:
      - "18081:18081" # schema registry
      - "18082:18082" # pandaproxy
      - "19092:19092" # kafka API (host access)
      - "19644:9644"  # admin API
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.3
    container_name: redpanda-console
    networks:
      - pipeline_network
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8080:8080" # browse topics/messages at http://localhost:8080
    depends_on:
      redpanda:
        condition: service_healthy

  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    container_name: topic-init
    networks:
      - pipeline_network
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        rpk topic create raw_posts --partitions 3 --replicas 1 --brokers redpanda:9092 || true
        echo "topics ready:"
        rpk topic list --brokers redpanda:9092
    restart: "no"

  producer:
    build:
      context: ..
      dockerfile: producer/Dockerfile
    container_name: producer
    networks:
      - pipeline_network
    env_file:
      - ../.env
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    networks:
      - pipeline_network
    # Local-only dev credentials, set here (not from .env) so ClickHouse,
    # Grafana and the processor can't drift apart.
    environment:
      CLICKHOUSE_DB: sentiment
      CLICKHOUSE_USER: pipeline
      CLICKHOUSE_PASSWORD: pipeline
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123" # HTTP interface (clickhouse-connect, curl, Play UI at /play)
      - "9000:9000" # native protocol (clickhouse-client)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    networks:
      - pipeline_network
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.5.1
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sentiment.json
      CLICKHOUSE_DATABASE: sentiment
      CLICKHOUSE_USER: pipeline
      CLICKHOUSE_PASSWORD: pipeline
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000" # dashboards at http://localhost:3000 (admin/admin to edit)
    depends_on:
      clickhouse:
        condition: service_healthy

  processor:
    build:
      context: ..
      dockerfile: processor/Dockerfile
    container_name: processor
    networks:
      - pipeline_network
    env_file:
      - ../.env
    environment:
      KAFKA_BROKERS: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: pipeline
      CLICKHOUSE_PASSWORD: pipeline
      CLICKHOUSE_DATABASE: sentiment
    volumes:
      # Quix window/trend state (RocksDB). It's also backed up to changelog
      # topics in Redpanda, so losing this volume only costs a slower restart.
      - processor-state:/app/state
    depends_on:
      redpanda:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
