[project]
name = "sentiment-trend-pipeline"
version = "0.1.0"
description = "Real-time sentiment and trend analysis pipeline (learning/portfolio project)"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "vaderSentiment>=3.3",
    "transformers>=4.40",
    "torch>=2.2",
    "websocket-client>=1.7",
    "praw>=7.7",
    "confluent-kafka>=2.3",
    "quixstreams>=3.0",
    "streamlit>=1.37",
    "pandas>=2.2",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "producer", "processor", "phase1"]
